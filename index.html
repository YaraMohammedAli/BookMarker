<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark</title>
  <link rel="shortcut icon" href="./images/bookMarkIcon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Caption:wght@400;700&family=Pacifico&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/all.min.css">
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/index.css">
  <link rel="stylesheet" href="./css/media.css">
</head>

<body id="body">

  <section class="p-4 m-1  text-center ">
    <div class="container">
      <h1 class="pb-4 firstHeader ">Bookmarker</h1>
      <hr>
      <div class="subHeader d-flex justify-content-center align-items-center">
        <i class="fa-solid fa-bookmark icon1"></i>
        <h1 class="fs-4">Bookmark your favorite sites</h1>
        <i class="fa-solid fa-bookmark icon2"></i>
      </div>
      <form class="d-flex flex-column align-items-start my-4 p-2" >
        <div class="formLabel d-flex align-items-center py-2">
          <i class="fa-solid fa-book-bookmark pe-2"></i>
          <label class="mx-2 fw-semibold" for="siteName"> Site Name</label>
        </div>
        <input class="w-100 mx-1 mb-2 py-1 px-2 rounded-1 form-control" type="text" name="siteName" id="siteName" placeholder="Bookmark Name">
        <div class="formLabel d-flex align-items-center py-2">
          <i class="fa-solid fa-link pe-2"></i>
          <label class="mx-2 fw-semibold"  for="siteUrl"> Site URL</label>
        </div>
        <input class="w-100 mx-1 mb-2 py-1 px-2 rounded-1 form-control" type="text" name="siteUrl" id="siteUrl" placeholder="WebSite URL">
        <input onclick="createBookmark(event)" class=" mx-auto mt-4 mb-2 btn btn-danger submit-btn" type="submit">
      </form>
      <hr>
      <table border="1"  class="text-center table my-5" >
        <thead>
          <tr>
            <th>index</th>
            <th>Website Name</th>
            <th>Visit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="tbody" >
        </tbody>
      </table>
    </div>
  </section>

  <section class="overlay" id="overlay">
    <div class="container  bg-white p-3 alert" id="alert">
      <div class="alerthead d-flex justify-content-between ">
        <div class="circels d-flex p-2">
          <div class="bg-danger rounded-circle firstCircle mx-1 "></div>
          <div class="bg-warning rounded-circle firstCircle mx-1 "></div>
          <div class="bg-success rounded-circle firstCircle mx-1 "></div>
        </div>
        <button onclick="closeAlert()" class="bg-white closeicon">
          <i class="fa-solid fa-xmark close fs-3 "></i>
        </button>
      </div>
      <p ><pre class="fw-semibold">Site Name or Url is not valid, Please follow the
rules below :</pre></p>

        <ul class="list-unstyled">
          <li><i class="fa-regular fa-circle-right p-2 mx-1 listicon"></i>  Site name must contain at least 3 characters</li>
          <li><i class="fa-regular fa-circle-right p-2 mx-1 listicon"></i>  Site URL must be a valid one</li>
        </ul>

    </div>
  </section>




  <script src="./js/bootstrap.bundle.js"></script>
  <script src="./js/index.js"></script>
</body>

</html>
